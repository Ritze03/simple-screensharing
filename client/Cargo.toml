[package]
name = "simple-screensharing-client"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
base64 = "0.23.0"
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.33"
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence", "serde"] }
egui = "0.33.3"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "platform-verifier"] }
rand = "0.10.2"
# Terminal UI mode (`--tui`, see src/tui.rs) — an additive alternative to the
# default eframe/egui window, not a replacement. Versions deliberately match
# the sibling relay server's Cargo.toml (ratatui 0.30.x + crossterm 0.29.x) so
# the two repos don't drift onto divergent ratatui versions.
ratatui = "0.30.2"
# `default-features = false` on purpose: ratatui-image's default feature set
# includes `chafa-dyn`, which links the *system* libchafa via pkg-config. The
# TUI deliberately renders with the built-in pure-Rust Unicode half-block
# backend instead (see src/tui.rs's module docs for why), so pulling in a
# system C library — and a build that breaks wherever it isn't installed —
# would buy nothing. `crossterm` matches the backend ratatui uses here.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
rust-i18n = "4.2.1"

# ashpd (xdg-desktop-portal bindings) is Linux/Unix-only: it shells out to
# `std::os::unix` internals that simply don't exist on Windows, and portal
# permission dialogs are a Wayland/X11-desktop-environment concept with no
# Windows equivalent anyway. Windows' capture path (src/capture.rs) captures
# directly via GStreamer's `d3d11screencapturesrc` instead — see that
# module's `#[cfg(windows)]` capture source code for details. Gating this as
# a target-specific dependency means it's not even compiled on Windows,
# which is what was actually breaking `cargo build` there.
[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
