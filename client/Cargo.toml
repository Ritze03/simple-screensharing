[package]
name = "simple-screensharing-client"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
ashpd = "0.13.13"
bincode = { version = "2.0.1", features = ["serde"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence", "serde"] }
egui = "0.33.3"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "platform-verifier"] }
rand = "0.10.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
