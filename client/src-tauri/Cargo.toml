[package]
name = "simple-screensharing-client-tauri"
version = "0.1.0"
description = "Tauri desktop shell for Simple Screensharing"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
rust-i18n = "4.2.1"

# `AppState::drain_events` needs an `&egui::Context` — see `state.rs`'s doc
# comment for why an unshown one is created here rather than modifying
# `session.rs`'s signature.
egui = "0.33.3"

# Reuse the existing backend crate's `[lib]` target as-is (networking,
# capture, decode, encryption, bandwidth allocation) — no logic changes,
# see ../src/lib.rs for what it exports.
simple-screensharing-client = { path = ".." }

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_builder`/`mock_context` — lets
# `commands::tests::join_room_outside_a_tokio_runtime_does_not_panic` invoke
# the real `#[tauri::command]` wrapper (needs a real `tauri::State`, which
# can't be constructed by hand) instead of only its `_impl` helper.
tauri = { version = "2", features = ["test"] }
