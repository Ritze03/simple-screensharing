<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2129"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C7BF7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5C7BF7" stop-opacity="0"/>
    </radialGradient>
    <!-- cuts the blue screen where the green window sits: window area plus a 16-unit gap beyond the green stroke -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="235" y="245" width="149" height="107" rx="32" fill="#000" stroke="#000" stroke-width="64" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- screen (blue), cut behind the window -->
  <rect x="128" y="160" width="181" height="128" rx="32" fill="none" stroke="#5C7BF7" stroke-width="32" stroke-linejoin="round" mask="url(#cut)"/>
  <!-- window (green), unfilled -->
  <rect x="235" y="245" width="149" height="107" rx="32" fill="none" stroke="#50C878" stroke-width="32" stroke-linejoin="round"/>
</svg>
